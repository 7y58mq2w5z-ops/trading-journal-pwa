
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trading Journal</title>
  <link rel="stylesheet" href="styles33.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
    .modal-mask.show { display: flex; }
    .modal-card { background: #fff; border-radius: 1rem; padding: 1.25rem; max-width: 500px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; }
    .tab-btn { padding: .6rem; border-radius: .75rem; background: #e5e7eb; font-weight: 500; }
    .tab-active { background: #111827; color: #fff; }
    .card { background: #fff; border-radius: 1rem; padding: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .input { border:1px solid #e2e8f0; border-radius:.5rem; padding:.5rem; width: 100%; outline: none; }
    .input:focus { border-color: #3b82f6; }
    .pnl-pos { color: #dc2626 !important; }
    .pnl-neg { color: #2563eb !important; }
    /* 리스트 한 줄 유지 */
    .nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 이미지 수평 나열 */
    .detail-images { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .detail-img-wrapper { width: 50%; aspect-ratio: 16/9; overflow: hidden; border-radius: 0.5rem; border: 1px solid #f1f5f9; }
    .detail-img-wrapper img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app" class="max-w-md mx-auto p-4 pb-20">
    <header class="mb-4 text-center"><h1 class="text-xl font-bold">📈 My Trading Journal</h1></header>

    <nav class="grid grid-cols-3 gap-2 sticky top-0 z-20 bg-slate-50 py-2 mb-4">
      <button data-tab="form" class="tab-btn">입력</button>
      <button data-tab="list" class="tab-btn tab-active">리스트</button>
      <button data-tab="calendar" class="tab-btn">캘린더</button>
    </nav>

    <!-- 입력 섹션 -->
    <section id="tab-form" class="card hidden">
      <form id="tradeForm" class="space-y-3">
        <input type="hidden" name="id">
        <!-- 4번: 날짜/종목명 수평 일렬 맞춤 -->
        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-xs font-bold text-slate-500">날짜</label>
            <input type="date" name="date" required class="input">
          </div>
          <div class="flex-1">
            <label class="text-xs font-bold text-slate-500">종목명</label>
            <input type="text" name="symbol" required class="input" placeholder="종목명">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <label class="text-xs font-bold text-slate-500">수량<input type="number" name="qty" class="input"></label>
          <label class="text-xs font-bold text-slate-500">매수가<input type="number" name="buy_price" class="input"></label>
          <label class="text-xs font-bold text-slate-500 text-red-500">실현손익<input type="number" name="pnl_input" class="input"></label>
        </div>

        <textarea name="comment" rows="3" class="input text-sm" placeholder="매매 복기..."></textarea>

        <!-- 5번: 파일명 표시 기능 포함된 이미지 업로드 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-center p-2 bg-slate-100 rounded-lg text-xs cursor-pointer border border-dashed border-slate-300">
              이미지 1 선택
              <input type="file" name="image1" class="hidden file-input" data-target="file-name-1">
            </label>
            <div id="file-name-1" class="text-[10px] text-slate-400 mt-1 truncate px-1">선택된 파일 없음</div>
          </div>
          <div>
            <label class="block text-center p-2 bg-slate-100 rounded-lg text-xs cursor-pointer border border-dashed border-slate-300">
              이미지 2 선택
              <input type="file" name="image2" class="hidden file-input" data-target="file-name-2">
            </label>
            <div id="file-name-2" class="text-[10px] text-slate-400 mt-1 truncate px-1">선택된 파일 없음</div>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" id="saveBtn" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold">저장하기</button>
          <button type="button" id="cancelBtn" class="px-4 bg-slate-200 rounded-xl text-sm">취소</button>
          <button type="button" id="deleteTrade" class="hidden px-4 bg-red-100 text-red-600 rounded-xl text-sm font-bold">삭제</button>
        </div>
      </form>
    </section>

    <!-- 리스트 섹션 -->
    <section id="tab-list" class="card">
      <div id="listContainer" class="overflow-hidden"></div>
      <div class="mt-6"><canvas id="pnlChart" height="150"></canvas></div>
    </section>

    <!-- 캘린더 섹션 (8번 기능 복구) -->
    <section id="tab-calendar" class="card hidden">
      <div id="calendar"></div>
      <!-- 일자별 리스트 및 메모 표시 영역 -->
      <div id="calendarDetailArea" class="mt-4 p-3 bg-slate-50 rounded-xl hidden">
        <div class="flex justify-between items-center mb-2">
          <h3 id="selectedDateTitle" class="font-bold text-sm"></h3>
          <button id="addDailyNoteBtn" class="text-[10px] bg-slate-800 text-white px-2 py-1 rounded">메모 작성</button>
        </div>
        <div id="dailyTradeList" class="space-y-2 mb-3"></div>
        <div id="dailyNoteDisplay" class="text-xs text-slate-600 italic border-t pt-2"></div>
      </div>
    </section>

    <!-- 상세 모달 (1, 2번 반영) -->
    <div id="detailModal" class="modal-mask">
      <div class="modal-card">
        <button id="detailClose" class="absolute top-3 right-4 text-xl">✕</button>
        <div id="detailContent"></div>
      </div>
    </div>

    <!-- 일자별 메모 모달 (8번 복구) -->
    <div id="noteModal" class="modal-mask">
      <div class="modal-card">
        <h3 class="font-bold mb-3">일자별 코멘트</h3>
        <textarea id="noteText" class="input h-32 text-sm" placeholder="지수 흐름이나 소감..."></textarea>
        <div class="flex gap-2 mt-3">
          <button id="saveNoteBtn" class="flex-1 py-2 bg-slate-800 text-white rounded-lg">메모 저장</button>
          <button id="closeNoteBtn" class="px-4 py-2 bg-slate-100 rounded-lg">닫기</button>
        </div>
      </div>
    </div>

    <!-- 전체화면 뷰어 (2번 반영) -->
    <div id="imgFullscreen" class="fixed inset-0 bg-black hidden z-[100] items-center justify-center cursor-pointer">
      <img id="imgFullscreenImg" class="max-w-full max-h-full">
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
