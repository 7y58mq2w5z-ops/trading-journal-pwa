<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trading Journal</title>
  <link rel="manifest" href="manifest33.json">
  <meta name="theme-color" content="#0f172a"/>
  <link rel="stylesheet" href="styles33.css">
  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Inline fallback styles to prevent overlay blocking clicks -->
  <style>
    /* Ensure the modal is hidden until explicitly opened */
    .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); align-items: center; justify-content: center; z-index: 50; }
    .modal-mask.show { display: flex; }
    .modal-card { background: #fff; border-radius: .75rem; padding: 1rem; max-width: 640px; width: calc(100% - 2rem); position: relative; }
    .modal-close { position: absolute; top: .75rem; right: .75rem; }
    /* Basic button/tab styles in case styles33.css didn't load */
    .tab-btn { padding: .5rem .75rem; border-radius: .75rem; background: #e5e7eb; }
    .tab-active { background: #111827; color: #fff; }
    .card { background: #fff; border-radius: .75rem; padding: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .input { border:1px solid #e5e7eb; border-radius:.5rem; padding:.5rem .75rem; }
    .btn-secondary { border:1px solid #e5e7eb; border-radius:.5rem; padding:.5rem .75rem; background:#f8fafc; }
    .btn-save { background:#10b981; color:#fff; border-radius:.5rem; padding:.5rem .75rem; }
    .btn-new, #cancelBtn {
      background: #374151 !important; /* slate-700 */
      color: #fff !important;
      border-radius: .5rem;
      padding: .5rem .75rem;
    }
    .btn-danger { background:#ef4444; color:#fff; border-radius:.5rem; padding:.5rem .75rem; }
    .pnl-pos { color:#dc2626; font-weight:600; }
    .pnl-neg { color:#2563eb; font-weight:600; }
    .nowrap { white-space:nowrap; }
    .detail-img { border-radius:.75rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); max-height:60vh; width:100%; object-fit:contain; cursor: zoom-in; }
    .detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap: .75rem; }
    .detail-images { grid-column: 1 / -1; display:flex; gap:.75rem; }

    /* 월~금 평일 칸(.fc-day-mon ~ .fc-day-fri) 내부의 이벤트에만 적용 */
    .fc-day-mon .fc-event, .fc-day-mon .fc-event-main, .fc-day-mon .fc-daygrid-event-harness,
    .fc-day-tue .fc-event, .fc-day-tue .fc-event-main, .fc-day-tue .fc-daygrid-event-harness,
    .fc-day-wed .fc-event, .fc-day-wed .fc-event-main, .fc-day-wed .fc-daygrid-event-harness,
    .fc-day-thu .fc-event, .fc-day-thu .fc-event-main, .fc-day-thu .fc-daygrid-event-harness,
    .fc-day-fri .fc-event, .fc-day-fri .fc-event-main, .fc-day-fri .fc-daygrid-event-harness {
      background-color: transparent !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important; /* 평일 터치 하이라이트 제거 */
    }
    
    /* 월~금 평일 이벤트 클릭 시 생기는 Overlay(덮개) 제거 */
    .fc-day-mon .fc-event::before, .fc-day-mon .fc-event::after,
    .fc-day-tue .fc-event::before, .fc-day-tue .fc-event::after,
    .fc-day-wed .fc-event::before, .fc-day-wed .fc-event::after,
    .fc-day-thu .fc-event::before, .fc-day-thu .fc-event::after,
    .fc-day-fri .fc-event::before, .fc-day-fri .fc-event::after {
      display: none !important;
    }
    
    /* 모든 이벤트 메인 텍스트 보장 (공통) */
    .fc-event-main {
      opacity: 1 !important;
      position: relative;
      z-index: 2;
    }
    
    /* 3. 날짜 박스만 콕 집어서 너비 줄이기 */
    input[type="date"].input {
      width: 328px;
      height: 42px;
      flex: none;
    } 
    /* 선택된 캘린더 날짜 강조용 (JS에서 클래스만 붙여주면 됨) */
    .cal-selected-day {
      background-color: rgba(59,130,246,0.16) !important; /* blue-500/15 */
      border-radius: 0.5rem;
    }
    /* 입력창 포커스 시 자동 확대 방지 (줌 기능은 살려둠) */
    input[type="text"], 
    input[type="number"], 
    input[type="date"], 
    textarea, 
    select {
      font-size: 16px !important;
      touch-action: manipulation; /* 두 번 탭해서 확대되는 동작 방지 */
    }
    /* 입력창 포커스 시 폰트 크기가 작으면 확대되므로 기본 크기를 16px로 맞춥니다 */
    .input, textarea {
      font-size: 16px !important;
    }
    /* 전체화면 이미지 뷰어 설정 */
    #imgFullscreen img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      /* 전체화면 상태에서 손가락 줌이 가능하도록 설정 */
      touch-action: pinch-zoom; 
    }
    /* 전체 화면 이미지 뷰어용 */
    #imgFullscreen { display: none; }
    #imgFullscreen.show { display: flex; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app" class="max-w-3xl mx-auto p-4 pb-24">
    <header class="flex items-center justify-between mb-4">
     <div class="flex items-baseline gap-2">
      <h1 class="text-xl font-bold">매매일지</h1>
      <!-- 아래 span 태그의 숫자를 수정할 때마다 직접 올리시면 됩니다 -->
      <span class="text-xs font-medium text-slate-400 bg-slate-200/50 px-2 py-0.5 rounded-full">ver 2.5</span>
     </div>
      <button id="installBtn" class="px-3 py-2 rounded-xl bg-emerald-600 text-white hidden">홈 화면에 추가</button>
    </header>

    <!-- Tabs -->
    <nav class="grid grid-cols-3 gap-2 sticky top-0 z-10 mb-3">
      <button data-tab="form" id="nav-input" class="tab-btn tab-form">입력</button>
      <button data-tab="list" id="nav-list" class="tab-btn tab-list tab-active">리스트</button>
      <button data-tab="calendar" id="nav-calendar" class="tab-btn tab-calendar">캘린더</button>
    </nav>

    <!-- FORM -->
    <section id="tab-form" class="card hidden">
      <h2 class="text-lg font-semibold mb-3">거래 입력/수정</h2>
      <form id="tradeForm" class="grid grid-cols-1 gap-3">
        <input type="hidden" name="id" value="">
        <label class="label">날짜 <input type="date" name="date" required class="input"></label>
        <label class="label">종목명 <input type="text" name="symbol" required class="input" placeholder="종목명"></label>

        <!-- ✅ 종목 강조 체크 -->
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" name="highlight">
          <span class="text-sm text-slate-600">종목 강조 표시</span>
        </label>

        <div class="grid grid-cols-3 gap-2">
          <label class="label">수량 <input type="number" name="qty" step="1" class="input"></label>
          <label class="label">매수가 <input type="number" name="buy_price" step="0.01" class="input"></label>
          <label class="label">실현손익 <input type="number" name="pnl_val" step="1" class="input"></label>
        </div>

        <fieldset class="label">
          <legend class="mb-1 font-semibold">Tags</legend>

          <!-- 전략 -->
          <div class="mb-2">
            <div class="text-xs text-slate-400 mb-1">전략</div>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="돌파진입"> 돌파진입</label>
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="눌림진입"> 눌림진입</label>
            </div>
          </div>

          <!-- 감정 -->
          <div class="mb-2">
            <div class="text-xs text-slate-400 mb-1">감정</div>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="차분"> 차분</label>
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="충동"> 충동</label>
            </div>
          </div>

          <!-- 성과 -->
          <div class="mb-2">
            <div class="text-xs text-slate-400 mb-1">성과</div>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="좋은매매"> 좋은매매</label>
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="큰손실"> 큰손실</label>
            </div>
          </div>

          <!-- 리스크 -->
          <div class="mb-1">
            <div class="text-xs text-slate-400 mb-1">리스크</div>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="손절지연"> 손절지연</label>
              <label class="flex items-center gap-1"><input type="checkbox" name="tags[]" value="리스크과다"> 리스크과다</label>
            </div>
          </div>

        </fieldset>

        <textarea name="comment" rows="3" class="input w-full" placeholder=""></textarea>

        <div class="grid grid-cols-2 gap-2">
          <label class="label relative overflow-hidden">이미지1
            <span class="btn-secondary inline-block text-center">파일 선택</span>
            <input type="file" name="image1" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
          </label>
          <label class="label relative overflow-hidden">이미지2
            <span class="btn-secondary inline-block text-center">파일 선택</span>
            <input type="file" name="image2" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
          </label>
        </div>

        <div class="flex gap-2 mt-2">
          <button class="btn-save" type="submit" id="saveBtn">저장</button>
          <button class="btn-new" type="button" id="cancelBtn">새로 입력</button>
          <button class="btn-danger hidden" type="button" id="deleteTrade">삭제</button>
        </div>
      </form>
    </section>

    <!-- LIST -->
    <section id="tab-list" class="card">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold">매매 리스트</h2>
        <div class="flex gap-2">
          <button id="exportBtn" class="btn-secondary">내보내기(JSON)</button>
          <label class="btn-secondary relative overflow-hidden">
            가져오기
            <input id="importInput" type="file" accept="application/json" class="absolute inset-0 opacity-0 cursor-pointer">
          </label>
        </div>
      </div>
      <div class="flex gap-2 mb-2">
        <input id="searchInput" class="input flex-1" placeholder="종목/태그 검색">
        <select id="sortSelect" class="input w-36">
          <option value="date_desc">날짜↓</option>
          <option value="date_asc">날짜↑</option>
          <option value="pnl_desc">손익↓</option>
          <option value="pnl_asc">손익↑</option>
        </select>
      </div>
      <div id="listContainer" class="overflow-x-hidden"></div>

      <div class="card mt-4">
        <h3 class="font-semibold mb-2">간단 분석</h3>
        <canvas id="pnlChart" height="200"></canvas>
      </div>
    </section>

    <!-- CALENDAR -->
    <section id="tab-calendar" class="card hidden">
      <h2 class="text-lg font-semibold mb-3">손익 캘린더</h2>
      <div id="calendar"></div>
      <div id="calendarList" class="mt-4"></div>
    </section>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="modal-mask">
      <div class="modal-card">
        <button id="detailClose" class="modal-close">닫기</button>
        <div id="detailContent"></div>
      </div>
    </div>

    <!-- 일자별 메모/이미지 모달 -->
    <div id="noteModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
      <div class="bg-white p-4 rounded-xl w-full max-w-lg relative">
        <button id="noteClose" class="absolute right-3 top-2 text-slate-500 text-xl">&times;</button>
        <h3 class="text-lg font-semibold mb-3">
          <span id="noteDateLabel">일자 메모 및 이미지</span>
        </h3>

        <textarea id="noteText" class="w-full border rounded p-2 mb-3" rows="4"
                  placeholder="오늘 일기 / 지수 흐름 등을 기록하세요"></textarea>

        <div class="flex gap-2">
          <div class="w-1/2">
            <button id="noteImg1Btn" class="btn-secondary w-full mb-1">이미지 1 선택</button>
            <input type="file" id="noteImg1Input" accept="image/*" class="hidden">
            <img id="noteImg1Preview" class="w-full rounded cursor-pointer hidden">
          </div>
          <div class="w-1/2">
            <button id="noteImg2Btn" class="btn-secondary w-full mb-1">이미지 2 선택</button>
            <input type="file" id="noteImg2Input" accept="image/*" class="hidden">
            <img id="noteImg2Preview" class="w-full rounded cursor-pointer hidden">
          </div>
        </div>
      </div>
    </div>

    <div id="imgFullscreen" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[60]">
      <img id="imgFullscreenImg" class="max-w-full max-h-full">
    </div>

  </div>

  <script type="module" src="./app.js"></script>
  <script>
    console.log("[boot] index.html loaded");
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
