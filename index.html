<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trading Journal (Local-First PWA)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a"/>
  <link rel="stylesheet" href="styles.css">
  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app" class="max-w-3xl mx-auto p-4 pb-24">
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold">매매일지 (오프라인 PWA)</h1>
      <button id="installBtn" class="px-3 py-2 rounded-xl bg-emerald-600 text-white hidden">홈 화면에 추가</button>
    </header>

    <!-- Tabs -->
    <nav class="grid grid-cols-3 gap-2 sticky top-0 z-10 mb-3">
      <button data-tab="form" class="tab-btn">입력</button>
      <button data-tab="list" class="tab-btn tab-active">리스트</button>
      <button data-tab="calendar" class="tab-btn">캘린더</button>
    </nav>

    <!-- FORM -->
    <section id="tab-form" class="card hidden">
      <h2 class="text-lg font-semibold mb-3">거래 입력/수정</h2>
      <form id="tradeForm" class="grid grid-cols-1 gap-3">
        <input type="hidden" name="id" value="">
        <label class="label">날짜 <input type="date" name="date" required class="input"></label>
        <label class="label">종목명 <input type="text" name="symbol" required class="input" placeholder="종목명"></label>
        <div class="grid grid-cols-3 gap-2">
          <label class="label">수량 <input type="number" name="qty" step="1" class="input" value="1"></label>
          <label class="label">매수가 <input type="number" name="buy_price" step="0.01" class="input" value="0"></label>
          <label class="label">매도가 <input type="number" name="sell_price" step="0.01" class="input" value="0"></label>
        </div>
        <label class="label">Tags(콤마) <input type="text" name="tags" class="input" placeholder="예: 단타, 뉴스, 실험"></label>
        <label class="label">Comment <textarea name="comment" rows="3" class="input"></textarea></label>

        <div class="grid grid-cols-2 gap-2">
          <label class="label">이미지1 <input type="file" name="image1" accept="image/*" class="input"></label>
          <label class="label">이미지2 <input type="file" name="image2" accept="image/*" class="input"></label>
        </div>

        <div class="flex gap-2 mt-2">
          <button class="btn-primary" type="submit">저장</button>
          <button class="btn-secondary" type="button" id="resetForm">새로 입력</button>
          <button class="btn-danger hidden" type="button" id="deleteTrade">삭제</button>
        </div>
      </form>
    </section>

    <!-- LIST -->
    <section id="tab-list" class="card">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold">매매 리스트</h2>
        <div class="flex gap-2">
          <button id="exportBtn" class="btn-secondary">내보내기(JSON)</button>
          <label class="btn-secondary relative overflow-hidden">
            가져오기
            <input id="importInput" type="file" accept="application/json" class="absolute inset-0 opacity-0 cursor-pointer">
          </label>
        </div>
      </div>
      <div class="flex gap-2 mb-2">
        <input id="searchInput" class="input flex-1" placeholder="종목/태그 검색">
        <select id="sortSelect" class="input w-36">
          <option value="date_desc">날짜↓</option>
          <option value="date_asc">날짜↑</option>
          <option value="pnl_desc">손익↓</option>
          <option value="pnl_asc">손익↑</option>
        </select>
      </div>
      <div id="listContainer" class="overflow-x-auto"></div>

      <div class="card mt-4">
        <h3 class="font-semibold mb-2">간단 분석</h3>
        <canvas id="pnlChart" height="200"></canvas>
      </div>
    </section>

    <!-- CALENDAR -->
    <section id="tab-calendar" class="card hidden">
      <h2 class="text-lg font-semibold mb-3">손익 캘린더</h2>
      <div id="calendar"></div>
      <div id="calendarList" class="mt-4"></div>
    </section>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
