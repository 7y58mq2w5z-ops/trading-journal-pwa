<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Journal PWA (Safe Minimal)</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tailwind CDN (경고는 무시 가능 / 나중에 빌드로 교체 권장) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    console.log('[boot] index.html loaded');
    tailwind.config = {
      theme: { extend: {} }
    };
  </script>

  <!-- FullCalendar (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" defer></script>

  <style>
    .tab-active { background:#0ea5e9; color:white; }
    .btn-primary { @apply px-3 py-1 rounded bg-blue-600 text-white; }
    .btn-secondary { @apply px-3 py-1 rounded bg-slate-200 text-slate-800; }
    .input { @apply border rounded px-2 py-1; }
    .card { @apply border rounded-xl p-4 shadow-sm bg-white; }
    .nowrap { white-space: nowrap; }
    .pnl-pos { color:#dc2626; font-weight:600; } /* 양수: 빨강 */
    .pnl-neg { color:#2563eb; font-weight:600; } /* 음수: 파랑 */
    #detailModal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:50; }
    #detailModal.show { display:flex; }
    #detailContent { @apply bg-white rounded-xl p-5 w-full max-w-2xl; }
  </style>
</head>
<body class="bg-slate-50">
  <div class="max-w-5xl mx-auto p-4">
    <header class="mb-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold">Trading Journal</h1>
      <div class="space-x-2">
        <button class="tab-btn btn-secondary" data-tab="list">리스트</button>
        <button class="tab-btn btn-secondary" data-tab="form">입력</button>
        <button class="tab-btn btn-secondary" data-tab="calendar">캘린더</button>
      </div>
    </header>

    <!-- 리스트 탭 -->
    <section id="tab-list">
      <div class="mb-2 flex gap-2 items-center">
        <input id="searchInput" class="input flex-1" placeholder="종목/태그 검색" />
        <select id="sortSelect" class="input">
          <option value="date_desc">날짜↓</option>
          <option value="date_asc">날짜↑</option>
          <option value="pnl_desc">손익↓</option>
          <option value="pnl_asc">손익↑</option>
        </select>
        <button id="exportBtn" class="btn-secondary">내보내기</button>
        <label class="btn-secondary cursor-pointer">
          가져오기
          <input id="importInput" type="file" accept="application/json" class="hidden" />
        </label>
      </div>
      <div id="listContainer" class="overflow-x-auto card"></div>
    </section>

    <!-- 입력(폼) 탭 -->
    <section id="tab-form" class="hidden">
      <form id="tradeForm" class="card space-y-3">
        <input type="hidden" name="id" />
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <span class="text-sm text-slate-500">날짜</span>
            <input name="date" type="date" class="input w-full" required />
          </label>
          <label class="block">
            <span class="text-sm text-slate-500">종목</span>
            <input name="symbol" class="input w-full" placeholder="예: 삼성전자" required />
          </label>
          <label class="block">
            <span class="text-sm text-slate-500">수량</span>
            <input name="qty" type="number" step="1" class="input w-full" />
          </label>
          <label class="block">
            <span class="text-sm text-slate-500">매수가</span>
            <input name="buy_price" type="number" step="0.01" class="input w-full" />
          </label>
          <label class="block">
            <span class="text-sm text-slate-500">매도가</span>
            <input name="sell_price" type="number" step="0.01" class="input w-full" />
          </label>
          <label class="block">
            <span class="text-sm text-slate-500">태그(쉼표로 구분)</span>
            <input name="tags[]" data-dummy="true" class="hidden" /> <!-- 체크박스 없이 문자열로 저장 -->
            <input id="tagText" class="input w-full" placeholder="스캘핑, 데이트레이딩 등" />
          </label>
        </div>

        <label class="block">
          <span class="text-sm text-slate-500">메모</span>
          <textarea name="comment" rows="3" class="input w-full"></textarea>
        </label>

        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2">
            <input name="image1" type="file" accept="image/*" class="hidden">
            <span class="btn-secondary">파일 선택</span>
          </label>
          <label class="flex items-center gap-2">
            <input name="image2" type="file" accept="image/*" class="hidden">
            <span class="btn-secondary">파일 선택</span>
          </label>
        </div>

        <div class="flex items-center justify-between pt-2">
          <div class="space-x-2">
            <button type="submit" class="btn-primary">저장</button>
            <button type="button" id="resetForm" class="btn-secondary">초기화</button>
          </div>
          <button type="button" id="deleteTrade" class="btn-secondary hidden">삭제</button>
        </div>
      </form>
    </section>

    <!-- 캘린더 탭 -->
    <section id="tab-calendar" class="hidden">
      <div id="calendar" class="card"></div>
      <div id="calendarList" class="mt-4"></div>
    </section>
  </div>

  <!-- 상세 모달 -->
  <div id="detailModal">
    <div id="detailContent"></div>
  </div>

  <!-- 앱 스크립트: 캐시 무력화를 위해 파일명을 app_v13.js로 그대로 씁니다 -->
  <script src="app_v13.js" defer></script>

  <script>
    // 태그 입력값을 콤마 문자열로 저장되게끔 폼 submit 전에 맞춰줍니다.
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('tradeForm');
      const tagText = document.getElementById('tagText');
      if (form && tagText) {
        form.addEventListener('submit', () => {
          const fakeChecks = document.querySelectorAll('input[name="tags[]"]:not([data-dummy])');
          fakeChecks.forEach(el => el.remove()); // 혹시 기존 체크박스가 있다면 제거
          const hidden = document.createElement('input');
          hidden.type = 'hidden';
          hidden.name = 'tags';
          hidden.value = tagText.value;
          form.appendChild(hidden);
        });
      }
    }, { once: true });
  </script>
</body>
</html>
